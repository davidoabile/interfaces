  <style><![CDATA[

.coin, .scan { transform-box: view-box; transform-origin: 500px 500px; }
.rim-signal { fill: none; stroke: #FFD1A1; stroke-width: 18; stroke-linecap: round; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(.963); } }
@keyframes seek { 0%,100% { transform: rotate(-62deg); } 50% { transform: rotate(96deg); } }
@keyframes trace { 0%,100% { stroke-dashoffset: 0; opacity: .24; } 50% { stroke-dashoffset: -195; opacity: .68; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { transform: scale(.975); } 50% { transform: scale(1.035); } }
@keyframes signal { 0%,100% { opacity: .12; } 50% { opacity: .8; } }
@keyframes bounce { 0%,100% { transform: translateY(0) scale(1); } 35% { transform: translateY(-31px) scale(1.01); } 75% { transform: translateY(0) scale(.97,1.015); } }
@keyframes blink { 0%,75%,83%,91%,100% { opacity: .10; } 79%,87% { opacity: .92; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-38px); } 75% { transform: translateX(38px); } }
@media (prefers-reduced-motion: reduce) { .coin,.scan,.trace,.signal { animation: none !important; } }
.coin { animation: breathe 4s ease-in-out infinite; }
  ]]></style>
